<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>krypt</title>
    <meta property="og:title" content="krypt">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet"
    >
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            background: #060606;
            color: #e9e9e3;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        body {
            position: relative;
            min-height: 100dvh;
            font-family: 'JetBrains Mono', monospace;
        }
        canvas {
            z-index: 0;
            position: fixed;
            display: block;
            inset: 0;
        }
        /* INTRO */
        #intro {
            align-items: center;
            background: #060606;
            display: flex;
            position: fixed;
            inset: 0;
            z-index: 20;
            justify-content: center;
        }
        #intro.fading {
            opacity: 0;
            transition: opacity .5s ease .5s;
            pointer-events: none;
        }
        .wordmark {
            color: #fff;
            font-weight: 700;
            display: inline-flex;
            text-transform: lowercase;
            align-items: flex-end;
            font-size: clamp(28px, 11vmin, 58px);
            letter-spacing: -.01em;
        }
        .letter {
            transition: opacity .3s ease, width .3s ease, margin .3s ease;
            display: inline-block;
            opacity: 0;
            animation: letter-in .55s steps(1, end) forwards;
            filter: blur(8px);
        }
        .letter.gone {
            width: 0;
            margin: 0;
            overflow: hidden;
            opacity: 0 !important;
        }
        .cross {
            display: inline-block;
            height: 1em;
            position: relative;
            width: .34em;
            margin-left: .01em;
            opacity: 0;
            transform: scale(1.5);
            filter: blur(10px);
            animation: cross-in .9s steps(1, end) forwards;
        }
        .cross::before,
        .cross::after {
            content: "";
            background: #fff;
            border-radius: 1px;
            position: absolute;
        }
        .cross::before {
            width: .09em;
            top: 0;
            left: 50%;
            height: 1em;
            transform: translateX(-50%);
        }
        .cross::after {
            top: .22em;
            height: .09em;
            left: 0;
            width: .34em;
        }
        .cross.charge {
            transform: scale(.8) rotate(-2deg);
            transition: transform .22s ease-in;
        }
        .cross.portal {
            opacity: 0;
            transform: scale(60) rotate(3deg);
            filter: blur(0) brightness(2.6);
            transition:
                transform 1.05s cubic-bezier(.6, 0, .9, .3),
                opacity .85s ease-in .4s,
                filter 1.05s ease-in;
        }
        #flash {
            background: #fff;
            pointer-events: none;
            position: fixed;
            inset: 0;
            z-index: 19;
            opacity: 0;
        }
        #flash.pulse {
            opacity: .4;
            transition: opacity .22s ease-out;
        }
        #flash.pulse-out {
            opacity: 0;
            transition: opacity .35s ease-in;
        }
        @keyframes letter-in {
            0% { opacity:0; filter:blur(8px); }
            12% { filter:blur(0); opacity:1; }
            20% { opacity:.12; }
            28% { opacity:1; }
            38% { opacity:.25; }
            46% { opacity:1; }
            100% { filter:blur(0); opacity:1; }
        }
        @keyframes cross-in {
            0% { transform:scale(1.5); filter:blur(12px); opacity:0; }
            10% { opacity:1; filter:blur(0); }
            18% { opacity:.1; }
            26% { transform:scale(1.15); opacity:1; }
            34% { opacity:.15; }
            42% { transform:scale(1); opacity:1; }
            100% { transform:scale(1); filter:blur(0); opacity:1; }
        }
        /* SITE */
        #site {
            transform: scale(.97);
            align-items: center;
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
            opacity: 0;
            position: relative;
            z-index: 2;
        }
        #site.reveal {
            opacity: 1;
            transform: scale(1);
            transition: opacity .9s ease-out, transform .9s ease-out;
        }
        header {
            padding: 40px 20px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .brand {
            align-items: flex-end;
            color: #fff;
            display: inline-flex;
            font-size: clamp(30px, 6vw, 42px);
            font-weight: 700;
            letter-spacing: -.01em;
            text-transform: lowercase;
        }
        .brand .mini-cross {
            height: 1em;
            margin-left: .02em;
            position: relative;
            width: .34em;
        }
        .brand .mini-cross::before,
        .brand .mini-cross::after {
            background: #fff;
            border-radius: 1px;
            content: "";
            position: absolute;
        }
        .brand .mini-cross::before {
            top: 0;
            left: 50%;
            height: 1em;
            width: .1em;
            transform: translateX(-50%);
        }
        .brand .mini-cross::after {
            top: .22em;
            left: 0;
            height: .1em;
            width: .34em;
        }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>
    <audio
        id="bg-audio"
        src="godwillgiveuswhatweneed.mp3"
        preload="auto"
        loop>
    </audio>
    <div id="flash"></div>
    <!-- INTRO -->
    <div id="intro">
        <div class="wordmark" id="intro-wordmark">
            <span class="letter" style="animation-delay:0.00s">k</span>
            <span class="letter" style="animation-delay:0.11s">r</span>
            <span class="letter" style="animation-delay:0.22s">y</span>
            <span class="letter" style="animation-delay:0.33s">p</span>
            <span
                class="cross"
                id="intro-cross"
                style="animation-delay:1.05s">
            </span>
        </div>
    </div>
    <!-- SITE -->
    <div id="site">
        <header>
            <div class="brand">
                kryp<span class="mini-cross"></span>
            </div>
        </header>
    </div>
    <script>
        /* BACKGROUND */
        const cv = document.getElementById('bg');
        const gx = cv.getContext('2d');
        const rd = window.matchMedia(
            '(prefers-reduced-motion: reduce)'
        ).matches;
        let W, H, DP;
        function rz() {
            DP = Math.min(
                window.devicePixelRatio || 1,
                2
            );
            W = window.innerWidth;
            H = window.innerHeight;
            cv.width = W * DP;
            cv.height = H * DP;
            cv.style.width = W + 'px';
            cv.style.height = H + 'px';
            gx.setTransform(
                DP,
                0,
                0,
                DP,
                0,
                0
            );
            iD();
        }
        const AG = .24;
        const CN = 160;
        let dp = [];
        function nD(rc) {
            return {
                x:
                    Math.random() *
                    (W + H * Math.tan(AG)) -
                    H * Math.tan(AG),
                y:
                    rc
                        ? -20 - Math.random() * H
                        : Math.random() * H,
                len:
                    10 + Math.random() * 18,
                speed:
                    5.5 + Math.random() * 6,
                alpha:
                    .08 + Math.random() * .22,
                width:
                    Math.random() < .15
                        ? 1.4
                        : .8
            };
        }
        function iD() {
            dp = [];
            for (let i = 0; i < CN; i++) {
                dp.push(nD(false));
            }
        }
        rz();
        let lw = 0;
        let lh = 0;
        function hR() {
            const nw = window.innerWidth;
            const nh = window.innerHeight;
            if (
                Math.abs(nw - lw) < 2 &&
                Math.abs(nh - lh) < 80
            ) {
                return;
            }
            lw = nw;
            lh = nh;
            rz();
        }
        window.addEventListener(
            'resize',
            hR
        );
        function dw() {
            gx.fillStyle = '#060606';
            gx.fillRect(
                0,
                0,
                W,
                H
            );
            gx.lineCap = 'round';
            for (const d of dp) {
                const ddx =
                    Math.sin(AG) * d.len;
                const ddy =
                    Math.cos(AG) * d.len;
                gx.beginPath();
                gx.strokeStyle =
                    `rgba(200,200,196,${d.alpha})`;
                gx.lineWidth = d.width;
                gx.moveTo(
                    d.x,
                    d.y
                );
                gx.lineTo(
                    d.x - ddx,
                    d.y - ddy
                );
                gx.stroke();
                d.x +=
                    Math.sin(AG) *
                    d.speed;
                d.y +=
                    Math.cos(AG) *
                    d.speed;
                if (
                    d.y > H + 20 ||
                    d.x > W + 40
                ) {
                    Object.assign(
                        d,
                        nD(true)
                    );
                }
            }
            if (!rd) {
                requestAnimationFrame(dw);
            }
        }
        if (rd) {
            gx.fillStyle = '#070707';
            gx.fillRect(
                0,
                0,
                W,
                H
            );
        } else {
            dw();
        }
        /* AUDIO */
        const au =
            document.getElementById('bg-audio');
        au.volume = .5;
        function tp() {
            au.play().catch(() => {});
        }
        tp();
        function uA() {
            tp();
            window.removeEventListener(
                'click',
                uA
            );
            window.removeEventListener(
                'touchstart',
                uA
            );
            window.removeEventListener(
                'keydown',
                uA
            );
        }
        window.addEventListener(
            'click',
            uA
        );
        window.addEventListener(
            'touchstart',
            uA
        );
        window.addEventListener(
            'keydown',
            uA
        );
        /* INTRO */
        const it =
            document.getElementById('intro');
        const iw =
            document.getElementById(
                'intro-wordmark'
            );
        const ic =
            document.getElementById(
                'intro-cross'
            );
        const fl =
            document.getElementById('flash');
        const st =
            document.getElementById('site');
        function rI() {
            if (rd) {
                it.style.display = 'none';
                st.classList.add(
                    'reveal'
                );
                return;
            }
            setTimeout(() => {
                iw
                    .querySelectorAll('.letter')
                    .forEach(l =>
                        l.classList.add(
                            'gone'
                        )
                    );
            }, 1350);
            setTimeout(() => {
                ic.classList.add(
                    'charge'
                );
            }, 1600);
            setTimeout(() => {
                ic.classList.remove(
                    'charge'
                );
                ic.classList.add(
                    'portal'
                );
            }, 1820);
            setTimeout(() => {
                fl.classList.add(
                    'pulse'
                );
            }, 2350);
            setTimeout(() => {
                fl.classList.remove(
                    'pulse'
                );
                fl.classList.add(
                    'pulse-out'
                );
                st.classList.add(
                    'reveal'
                );
            }, 2500);
            setTimeout(() => {
                it.classList.add(
                    'fading'
                );
            }, 2550);
            setTimeout(() => {
                it.style.display = 'none';
            }, 3150);
        }
        rI();
    </script>
</body>
